version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - redis
    volumes:
      - ./backend/.env:/app/backend/.env
    restart: always

  # The ARQ Worker that processes scraping jobs
  worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "backend.worker.WorkerSettings"]
    environment:
      - REDIS_URL=redis://redis:6379
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - redis
    volumes:
      - ./backend/.env:/app/backend/.env
    restart: always

volumes:
  redis_data:
